name: Render Sellf Reel V7 Cinematic Editorial

on:
  push:
    branches: [reel-render-v7]
    paths:
      - '.github/workflows/render-offline-reel-v7.yml'

permissions:
  contents: write

env:
  OUT: reel-output/sellf_hero_reel_v7_cinematic_editorial.mp4

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reel-render-v7

      - name: Prepare tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet gdown
          mkdir -p src clips reel-output runway

      - name: Download approved source footage
        shell: bash
        run: |
          set -euo pipefail
          dl() { gdown "https://drive.google.com/uc?id=$1" -O "$2"; }
          dl 1f9kaSmFRlm4iZXNDHKE5uKf94wto28K6 src/umu.mp4
          dl 1wIbo1BkMATXxqSJExaVRhHCrVlCdcxFf src/moshiqa.mp4
          dl 1B8h8sCxJMFJF0w3m95aat5ivxhhgYy9o src/stilevs.mp4
          dl 1MzQj0GgIN7RBeWv-ZWN8n7goPXIaxxbX src/barilla.mp4
          dl 1KuaY5fyCZNyPgy4HQwT1wwNtVVhm4kOY src/fashion.mp4
          dl 1X2sUkRWkQQi4yv_3kAOPb_EePDt2pcIN src/mion.mp4
          dl 17ByjQGmWnAD1rjqLHLdX7rJWskywQcZH src/eataly.mp4
          dl 13KwB8IEn1Rf0LVYG2NkWe05PphYLwt1a src/tefal.mp4
          dl 1MxYmNIvvHM2VPmPv02cFul7zc3GY2whL src/unilever.mp4
          curl -L --fail --retry 3 -o src/hero-original.mp4 https://cdn.sellfmedia.workers.dev/videos/website_main_video.mp4
          curl -L --fail --retry 3 -o src/logo.png https://raw.githubusercontent.com/sellfmedia-del/sellfV2/main/public/logo-beyaz.png

      - name: Build cinematic editorial cut
        shell: bash
        run: |
          set -euo pipefail

          base_grade="eq=contrast=1.115:saturation=0.885:brightness=-0.018:gamma=0.978,colorbalance=rs=.018:gs=.006:bs=-.012:rh=.028:gh=.012:bh=-.020,vignette=PI/13,unsharp=5:5:0.18:5:5:0.0,noise=alls=1.05:allf=t"

          make_timed() {
            local input="$1" output="$2" start="$3" rawlen="$4" outlen="$5" mode="$6" speed="$7"
            local pre vf
            case "$mode" in
              cropbottom) pre="crop=iw:ih*0.78:0:0," ;;
              event) pre="crop=iw:ih*0.86:0:ih*0.02," ;;
              *) pre="" ;;
            esac
            vf="${pre}scale=1980:1114:force_original_aspect_ratio=increase,crop=1920:1080:(iw-ow)/2:(ih-oh)/2,fps=30,setsar=1,${base_grade},setpts=PTS/${speed},trim=duration=${outlen},setpts=PTS-STARTPTS"
            ffmpeg -hide_banner -loglevel error -ss "$start" -i "$input" -t "$rawlen" -vf "$vf" -an -c:v libx264 -preset fast -crf 16 -pix_fmt yuv420p -movflags +faststart "$output" -y
          }

          make_fraction() {
            local input="$1" output="$2" fraction="$3" rawlen="$4" outlen="$5" mode="$6" speed="$7"
            local dur start
            dur=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$input")
            start=$(python -c 'import sys; D=float(sys.argv[1]); f=float(sys.argv[2]); L=float(sys.argv[3]); print(f"{max(.2,min(D*f,D-L-.3)):.3f}")' "$dur" "$fraction" "$rawlen")
            make_timed "$input" "$output" "$start" "$rawlen" "$outlen" "$mode" "$speed"
          }

          make_fraction src/umu.mp4       clips/01.mp4 0.12 1.15 0.82 normal 1.15
          make_timed    src/moshiqa.mp4   clips/02.mp4 7.75 0.95 0.64 normal 1.18
          make_timed    src/stilevs.mp4   clips/03.mp4 18.45 1.20 0.90 normal 1.10
          make_fraction src/barilla.mp4   clips/04.mp4 0.23 1.10 0.76 normal 1.16
          make_timed    src/fashion.mp4   clips/05.mp4 37.75 1.05 0.67 event 1.18
          make_fraction src/mion.mp4      clips/06.mp4 0.24 1.10 0.84 normal 1.12
          make_fraction src/eataly.mp4    clips/07.mp4 0.18 1.25 0.96 cropbottom 1.08
          make_fraction src/umu.mp4       clips/08.mp4 0.68 1.05 0.70 normal 1.18

          ffmpeg -hide_banner -loglevel error -ss 6 -i src/hero-original.mp4 -t 8 \
            -vf "scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,delogo=x=1682:y=996:w=228:h=72:show=0,crop=1888:1048:16:8,scale=1920:1080,fps=30,setsar=1,eq=contrast=1.025:saturation=0.975:brightness=-0.004" \
            -an -c:v libx264 -preset fast -crf 15 -pix_fmt yuv420p clips/09_typography.mp4 -y

          make_timed    src/moshiqa.mp4   clips/10.mp4 22.80 1.05 0.74 normal 1.16
          make_timed    src/stilevs.mp4   clips/11.mp4 41.90 0.95 0.62 normal 1.20
          make_fraction src/tefal.mp4     clips/12.mp4 0.63 1.10 0.78 cropbottom 1.14
          make_timed    src/moshiqa.mp4   clips/13.mp4 46.70 0.90 0.58 normal 1.20
          make_timed    src/stilevs.mp4   clips/14.mp4 63.80 1.15 0.88 normal 1.10
          make_fraction src/barilla.mp4   clips/15.mp4 0.67 1.00 0.66 normal 1.18
          make_fraction src/unilever.mp4  clips/16.mp4 0.62 1.08 0.74 normal 1.16
          make_timed    src/fashion.mp4   clips/17.mp4 46.40 1.20 0.84 event 1.12
          make_fraction src/eataly.mp4    clips/18.mp4 0.72 1.05 0.70 cropbottom 1.18
          make_fraction src/mion.mp4      clips/19.mp4 0.73 1.10 0.76 normal 1.16
          make_timed    src/stilevs.mp4   clips/20.mp4 75.30 0.95 0.62 normal 1.20
          make_timed    src/fashion.mp4   clips/21.mp4 30.70 1.15 0.84 event 1.12
          make_timed    src/moshiqa.mp4   clips/22.mp4 52.80 1.00 0.68 normal 1.18

          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=white:s=1920x1080:r=30:d=0.034 -an -c:v libx264 -crf 10 -pix_fmt yuv420p clips/flash.mp4 -y
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=black:s=1920x1080:r=30:d=0.067 -an -c:v libx264 -crf 10 -pix_fmt yuv420p clips/black2.mp4 -y

          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=black:s=1920x1080:r=30:d=2.65 -loop 1 -i src/logo.png \
            -filter_complex "[1:v]scale=340:-1[lg];[0:v][lg]overlay=(W-w)/2:225:shortest=1,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='sellfmedia.com':fontcolor=white:fontsize=29:x=(w-text_w)/2:y=805,fade=t=in:st=0:d=0.24,fade=t=out:st=2.20:d=0.45,fps=30,setsar=1" \
            -t 2.65 -an -c:v libx264 -preset fast -crf 15 -pix_fmt yuv420p clips/23_outro.mp4 -y

          printf "%s\n" \
            "file '01.mp4'" "file '02.mp4'" "file '03.mp4'" "file 'flash.mp4'" \
            "file '04.mp4'" "file '05.mp4'" "file '06.mp4'" "file '07.mp4'" "file '08.mp4'" \
            "file 'black2.mp4'" "file '09_typography.mp4'" "file 'black2.mp4'" \
            "file '10.mp4'" "file '11.mp4'" "file '12.mp4'" "file '13.mp4'" "file 'flash.mp4'" \
            "file '14.mp4'" "file '15.mp4'" "file '16.mp4'" "file '17.mp4'" "file '18.mp4'" \
            "file '19.mp4'" "file '20.mp4'" "file '21.mp4'" "file '22.mp4'" "file 'black2.mp4'" "file '23_outro.mp4'" > clips/list.txt

          ffmpeg -hide_banner -loglevel error -f concat -safe 0 -i clips/list.txt -an \
            -vf "crop=1916:1078:x='2+0.6*sin(n*0.41)':y='1+0.45*sin(n*0.33)',scale=1920:1080,eq=contrast=1.018:saturation=0.98:gamma=0.994,noise=alls=0.35:allf=t" \
            -c:v libx264 -preset medium -crf 16 -pix_fmt yuv420p -movflags +faststart reel-output/v7_picture.mp4 -y

          ffmpeg -hide_banner -loglevel error -i reel-output/v7_picture.mp4 -i src/hero-original.mp4 \
            -filter_complex "[1:a]asetpts=N/SR/TB,highpass=f=35,acompressor=threshold=-18dB:ratio=2.1:attack=14:release=170,loudnorm=I=-15:TP=-1.4:LRA=7,afade=t=in:st=0:d=0.18,afade=t=out:st=26.7:d=0.7[a]" \
            -map 0:v:0 -map "[a]" -c:v copy -c:a aac -b:a 192k -shortest -movflags +faststart "$OUT" -y

          ffmpeg -hide_banner -loglevel error -ss 6.8 -i src/umu.mp4 -t 4 -vf "scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,fps=30,setsar=1" -an -c:v libx264 -preset fast -crf 16 -pix_fmt yuv420p -movflags +faststart runway/fashion_umu.mp4 -y
          ffmpeg -hide_banner -loglevel error -ss 17.6 -i src/stilevs.mp4 -t 4 -vf "scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,fps=30,setsar=1" -an -c:v libx264 -preset fast -crf 16 -pix_fmt yuv420p -movflags +faststart runway/product_stilevs.mp4 -y
          ffmpeg -hide_banner -loglevel error -ss 36.9 -i src/fashion.mp4 -t 4 -vf "crop=iw:ih*0.86:0:ih*0.02,scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,fps=30,setsar=1" -an -c:v libx264 -preset fast -crf 16 -pix_fmt yuv420p -movflags +faststart runway/event_fashion.mp4 -y

          ffprobe -v error -show_entries format=duration,size -of default=nw=1 "$OUT"
          ffmpeg -hide_banner -loglevel error -i "$OUT" -vf "fps=1/2.6,scale=480:-1,tile=4x3" -frames:v 1 reel-output/v7_qc.jpg -y

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: sellf-hero-reel-v7-cinematic-editorial
          path: |
            ${{ env.OUT }}
            reel-output/v7_qc.jpg
            runway/*.mp4
          if-no-files-found: error

      - name: Publish review release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete reel-v7-cinematic --yes --cleanup-tag 2>/dev/null || true
          gh release create reel-v7-cinematic \
            "$OUT#Sellf Hero Reel V7 — cinematic editorial cut" \
            "reel-output/v7_qc.jpg#QC contact sheet" \
            "runway/fashion_umu.mp4#Runway source — fashion" \
            "runway/product_stilevs.mp4#Runway source — product" \
            "runway/event_fashion.mp4#Runway source — event" \
            --target "$GITHUB_SHA" --title "Sellf Hero Reel V7 Cinematic Editorial" \
            --notes "Approved V6.1 shots retained. Pacing, editorial punctuation, speed treatment, grading, texture, framing and audio mastering redesigned for a more cinematic agency-film finish. Includes three clean single-shot sources for selective Runway polish."
