name: Deploy Sellf Engage Studio

on:
  workflow_dispatch:
  push:
    branches:
      - codex/engage-foundation
    paths:
      - "engage-studio/**"
      - "sanity/engage/**"
      - ".github/workflows/deploy-engage-studio.yml"
      - "package.json"

concurrency:
  group: deploy-sellf-engage-studio
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Engage Studio
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out Engage branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund


      - name: Publish Williams-Sonoma insight
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: |
          node <<'NODE'
          const projectId = 'qozgfxrm'
          const dataset = 'production'
          const apiVersion = '2026-03-05'
          const token = process.env.SANITY_AUTH_TOKEN

          const queryUrl = new URL(`https://${projectId}.api.sanity.io/v${apiVersion}/data/query/${dataset}`)
          queryUrl.searchParams.set('query', '*[_type == "engageInsight" && defined(coverImage.asset._ref)] | order(publishedAt desc)[0]{coverImage}')

          const queryRes = await fetch(queryUrl, {
            headers: {Authorization: `Bearer ${token}`}
          })
          if (!queryRes.ok) throw new Error(`Sanity cover query failed: ${queryRes.status} ${await queryRes.text()}`)
          const queryData = await queryRes.json()
          const coverImage = queryData.result?.coverImage
          if (!coverImage?.asset?._ref) throw new Error('No existing Engage insight cover image found to reuse.')

          const pt = (key, style, text) => ({
            _key: key,
            _type: 'block',
            style,
            markDefs: [],
            children: [{_key: key + 'c', _type: 'span', marks: [], text}]
          })

          const doc = {
            _id: 'engageInsight-williams-sonoma-profit-system-2026',
            _type: 'engageInsight',
            title_tr: 'Ciro küçüldü. Kâr sistemi ayakta kaldı.',
            title_en: 'Revenue shrank. The profit system held.',
            slug: {_type: 'slug', current: 'williams-sonoma-ciro-kuculdu-kar-sistemi-ayakta-kaldi'},
            summary_tr: 'Williams-Sonoma, 2021 zirvesinin altında kalan cirosuna rağmen faaliyet kârını neredeyse aynı seviyede tuttu. Vaka, büyümenin yalnızca ciro değil; ürün, kanal ve operasyon sisteminin dayanıklılığı olduğunu gösteriyor.',
            summary_en: 'Williams-Sonoma kept operating profit nearly intact even with revenue below its 2021 peak. The case shows that growth is not just topline expansion, but the resilience of the product, channel and operating system.',
            publishedAt: '2026-09-28T08:10:00.000Z',
            featured: false,
            metrics: [
              { _key: 'm1', value: '-5.3%', label_tr: '2021–2025 ciro değişimi', label_en: '2021–2025 revenue change' },
              { _key: 'm2', value: '-2.6%', label_tr: '2021–2025 faaliyet kârı değişimi', label_en: '2021–2025 operating profit change' }
            ],
            format: 'article',
            layoutPreset: 'editorial',
            cardStyle: 'standard',
            coverImage,
            body_tr: [
              pt('tr1', 'h2', 'Durum'),
              pt('tr2', 'normal', 'Williams-Sonoma 2021\'de 8,25 milyar dolar gelir üretirken 2025\'te 7,81 milyar dolarda kaldı. Buna rağmen faaliyet kârı 1,45 milyar dolardan yalnızca 1,42 milyar dolara geriledi; faaliyet marjı ise %17,6\'dan %18,1\'e çıktı.'),
              pt('tr3', 'h2', 'Yaklaşım'),
              pt('tr4', 'normal', 'Şirket tek bir büyüme sinyaline bağımlı kalmadı. Dijital kanalı iş modelinin merkezinde tutarken ürün ve kanal yapısını konut döngüsünün dışına doğru genişletti. Sonuç, satış hacmi zirvesinin altında bile kârlılığı koruyabilen bir sistem oldu. 2026\'nın ikinci çeyreğinde e-ticaret karşılaştırılabilir satışları da %6,5 büyüdü.'),
              pt('tr5', 'h2', 'Sonuç'),
              pt('tr6', 'normal', '2021\'e göre yaklaşık %5 daha düşük ciroyla neredeyse aynı faaliyet kârı. Üstelik 2026\'daki yaklaşık 200 milyon dolarlık tarife iadesi ayrı, tek seferlik bir etki: bu dayanıklılığın 2025 karşılaştırmasını açıklamıyor.'),
              pt('tr7', 'h2', 'Genel çıkarım'),
              pt('tr8', 'normal', 'Büyüme, daha fazla satmak değil; talep zayıfladığında bile kâr üretebilen sistemi kurmaktır.')
            ],
            body_en: [
              pt('en1', 'h2', 'Situation'),
              pt('en2', 'normal', 'Williams-Sonoma generated $8.25 billion in revenue in 2021 and $7.81 billion in 2025. Yet operating income declined only from $1.45 billion to $1.42 billion, while operating margin increased from 17.6% to 18.1%.'),
              pt('en3', 'h2', 'Approach'),
              pt('en4', 'normal', 'The company avoided relying on a single growth signal. It kept digital at the center of the model while expanding its product and channel mix beyond the housing cycle. The result is a system capable of protecting profitability even when topline revenue remains below its peak. In Q2 2026, comparable e-commerce sales also grew 6.5%.'),
              pt('en5', 'h2', 'Result'),
              pt('en6', 'normal', 'Roughly 5% less revenue than in 2021, with almost the same operating profit. The approximately $200 million tariff-related refund recorded in 2026 is separate and temporary; it does not explain the 2025 comparison.'),
              pt('en7', 'h2', 'General takeaway'),
              pt('en8', 'normal', 'Growth is not simply selling more. It is building a system that can keep generating profit when demand weakens.')
            ],
            seo: {
              _type: 'engageSeo',
              title_tr: 'Williams-Sonoma: Ciro Küçülürken Kârı Korumak | Sellf Engage',
              title_en: 'Williams-Sonoma: Protecting Profit While Revenue Shrinks | Sellf Engage',
              description_tr: 'Williams-Sonoma vakası üzerinden ciro, faaliyet kârı ve dayanıklı büyüme sistemi arasındaki ilişkiyi analiz ediyoruz.',
              description_en: 'An analysis of Williams-Sonoma showing how resilient growth can protect operating profit even when revenue remains below its peak.'
            }
          }

          const mutateRes = await fetch(`https://${projectId}.api.sanity.io/v${apiVersion}/data/mutate/${dataset}?returnIds=true&visibility=sync`, {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${token}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({mutations: [{createOrReplace: doc}]})
          })
          if (!mutateRes.ok) throw new Error(`Sanity mutation failed: ${mutateRes.status} ${await mutateRes.text()}`)
          console.log(await mutateRes.text())
          NODE

      - name: Deploy Studio to Sanity
        working-directory: engage-studio
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: npx sanity deploy --yes --title "Sellf Engage" --url sellf-engage
