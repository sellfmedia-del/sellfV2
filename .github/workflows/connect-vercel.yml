name: Connect Vercel Git

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-vercel.yml'

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Start Vercel device login and publish instructions
        shell: bash
        run: |
          set -e
          script -q -c "vercel login" /tmp/vercel-login-session.txt &
          LOGIN_PID=$!
          PUBLISHED=0
          for i in $(seq 1 60); do
            sleep 1
            if [ -f /tmp/vercel-login-session.txt ]; then
              sed -E 's/\x1B\[[0-9;?]*[ -\/]*[@-~]//g' /tmp/vercel-login-session.txt | tr -d '\r' > vercel-login.txt || true
              if grep -Eqi 'https?://|device|code|log in|login' vercel-login.txt; then
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git add vercel-login.txt
                git commit -m "Publish temporary Vercel device login instructions" || true
                git push origin HEAD:main
                PUBLISHED=1
                break
              fi
            fi
          done
          if [ "$PUBLISHED" -ne 1 ]; then
            echo "Could not capture Vercel login instructions" >&2
            kill "$LOGIN_PID" || true
            exit 1
          fi
          wait "$LOGIN_PID"
      - name: Link existing V2 project
        run: vercel link --yes --project sellfwebsitev2
      - name: Connect GitHub repository
        run: vercel git connect --yes
      - name: Inspect project
        run: vercel project inspect sellfwebsitev2
