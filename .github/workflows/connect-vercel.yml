name: Connect Vercel Git

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-vercel.yml'

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Start Vercel device login and publish instructions
        shell: bash
        run: |
          set -e
          script -q -c "vercel login --no-color" /dev/null > /tmp/vercel-login-live.txt 2>&1 &
          LOGIN_PID=$!
          PUBLISHED=0
          for i in $(seq 1 90); do
            sleep 1
            if [ -s /tmp/vercel-login-live.txt ]; then
              sed -E 's/\x1B\[[0-9;?]*[ -\/]*[@-~]//g' /tmp/vercel-login-live.txt | tr -d '\r' > /tmp/vercel-login-clean.txt || true
              if grep -Eq 'https://vercel\.com/oauth/device\?user_code=' /tmp/vercel-login-clean.txt; then
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git fetch origin main
                git rebase origin/main
                cp /tmp/vercel-login-clean.txt vercel-login.txt
                git add vercel-login.txt
                git commit -m "Publish temporary Vercel device login instructions" || true
                git push origin HEAD:main
                PUBLISHED=1
                break
              fi
            fi
          done
          if [ "$PUBLISHED" -ne 1 ]; then
            cat /tmp/vercel-login-live.txt || true
            kill "$LOGIN_PID" || true
            exit 1
          fi
          cat /tmp/vercel-login-clean.txt
          wait "$LOGIN_PID"
      - name: Link existing V2 project
        run: vercel link --yes --project sellfwebsitev2
      - name: Connect GitHub repository
        run: vercel git connect --yes
      - name: Inspect project
        run: vercel project inspect sellfwebsitev2
