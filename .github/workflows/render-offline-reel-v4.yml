name: Render Sellf Offline Reel V4

on:
  push:
    branches: [reel-render-v4]
    paths:
      - '.github/workflows/render-offline-reel-v4.yml'

permissions:
  contents: write

env:
  OUT: reel-output/sellf_hero_reel_v4_offline_no_music.mp4

jobs:
  render:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reel-render-v4

      - name: Prepare tools
        run: |
          python -m pip install --quiet gdown
          ffmpeg -version | head -n 1
          mkdir -p src clips reel-output

      - name: Download source footage
        shell: bash
        run: |
          set -euo pipefail
          gdown --id 1f9kaSmFRlm4iZXNDHKE5uKf94wto28K6 -O src/umu.mp4
          gdown --id 1B8h8sCxJMFJF0w3m95aat5ivxhhgYy9o -O src/stilevs.mp4
          gdown --id 1MzQj0GgIN7RBeWv-ZWN8n7goPXIaxxbX -O src/barilla.mp4
          gdown --id 1KuaY5fyCZNyPgy4HQwT1wwNtVVhm4kOY -O src/fashion.mp4
          gdown --id 1X2sUkRWkQQi4yv_3kAOPb_EePDt2pcIN -O src/mion.mp4
          gdown --id 13KwB8IEn1Rf0LVYG2NkWe05PphYLwt1a -O src/tefal.mp4
          gdown --id 1Z1Fse1qbSrCFyfbhPUcZ2Rg_aRk0u8c6 -O src/castrol.mp4
          gdown --id 1wIbo1BkMATXxqSJExaVRhHCrVlCdcxFf -O src/moshiqa.mp4
          gdown --id 1MxYmNIvvHM2VPmPv02cFul7zc3GY2whL -O src/unilever.mp4
          gdown --id 17ByjQGmWnAD1rjqLHLdX7rJWskywQcZH -O src/eataly.mp4
          gdown --id 1fbFmlBz8H_WHiG851gCJVOMfpptujbS2 -O src/magazacilik.mp4
          gdown --id 10v0arP95ISHkZvXVOFKK8xQHenSMwpL5 -O src/helal.mp4
          gdown --id 1TtKJWt9tlyeKclt6XAdkEPD8DL3esOxW -O src/cagdas.mp4
          gdown --id 1tl2ytyu_eGmeMcr9nzXbZ8zh-fT9c6Lk -O src/disan.mp4
          curl -L --fail --retry 3 -o src/hero-original.mp4 https://cdn.sellfmedia.workers.dev/videos/website_main_video.mp4
          curl -L --fail --retry 3 -o src/logo.png https://raw.githubusercontent.com/sellfmedia-del/sellfV2/main/public/logo-beyaz.png

      - name: Build unique-shot offline cut
        shell: bash
        run: |
          set -euo pipefail

          make_clip() {
            local input="$1" output="$2" fraction="$3" cropmode="$4"
            local dur start vf
            dur=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$input")
            start=$(python -c 'import sys; D=float(sys.argv[1]); f=float(sys.argv[2]); clip=2.15; s=max(0.2,min(D*f,max(0.2,D-clip-0.35))); print(f"{s:.3f}")' "$dur" "$fraction")
            if [ "$cropmode" = "event" ]; then
              vf="crop=iw:ih*0.84:0:ih*0.04,scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,fps=30,setsar=1,eq=contrast=1.045:saturation=0.94:brightness=-0.008"
            else
              vf="scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,fps=30,setsar=1,eq=contrast=1.045:saturation=0.94:brightness=-0.008"
            fi
            ffmpeg -hide_banner -loglevel error -ss "$start" -i "$input" -t 2.15 -vf "$vf" -an -c:v libx264 -preset fast -crf 19 -pix_fmt yuv420p -movflags +faststart "$output" -y
          }

          make_clip src/umu.mp4          clips/01.mp4 0.45 normal
          make_clip src/stilevs.mp4      clips/02.mp4 0.32 normal
          make_clip src/barilla.mp4      clips/03.mp4 0.55 normal
          make_clip src/fashion.mp4      clips/04.mp4 0.38 event
          make_clip src/mion.mp4         clips/05.mp4 0.45 normal
          make_clip src/tefal.mp4        clips/06.mp4 0.52 normal
          make_clip src/castrol.mp4      clips/07.mp4 0.42 event

          ffmpeg -hide_banner -loglevel error -ss 6 -i src/hero-original.mp4 -t 8 -vf "scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,fps=30,setsar=1" -an -c:v libx264 -preset fast -crf 18 -pix_fmt yuv420p clips/08_typography.mp4 -y

          make_clip src/moshiqa.mp4      clips/09.mp4 0.58 normal
          make_clip src/unilever.mp4     clips/10.mp4 0.48 normal
          make_clip src/eataly.mp4       clips/11.mp4 0.56 normal
          make_clip src/magazacilik.mp4  clips/12.mp4 0.43 event
          make_clip src/helal.mp4        clips/13.mp4 0.52 event
          make_clip src/cagdas.mp4       clips/14.mp4 0.44 normal
          make_clip src/disan.mp4        clips/15.mp4 0.55 normal

          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=black:s=1920x1080:r=30:d=3 -loop 1 -i src/logo.png -filter_complex "[1:v]scale=500:-1[lg];[0:v][lg]overlay=(W-w)/2:(H-h)/2-45:shortest=1,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='sellfmedia.com':fontcolor=white:fontsize=29:x=(w-text_w)/2:y=h/2+115,fade=t=in:st=0:d=0.35,fade=t=out:st=2.55:d=0.45,fps=30,setsar=1" -t 3 -an -c:v libx264 -preset fast -crf 18 -pix_fmt yuv420p clips/16_outro.mp4 -y

          printf "%s\n" \
            "file '01.mp4'" \
            "file '02.mp4'" \
            "file '03.mp4'" \
            "file '04.mp4'" \
            "file '05.mp4'" \
            "file '06.mp4'" \
            "file '07.mp4'" \
            "file '08_typography.mp4'" \
            "file '09.mp4'" \
            "file '10.mp4'" \
            "file '11.mp4'" \
            "file '12.mp4'" \
            "file '13.mp4'" \
            "file '14.mp4'" \
            "file '15.mp4'" \
            "file '16_outro.mp4'" > clips/list.txt

          ffmpeg -hide_banner -loglevel error -f concat -safe 0 -i clips/list.txt -an -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p -movflags +faststart "$OUT" -y
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 "$OUT"

      - name: Commit rendered preview to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          git commit -m "Render offline Sellf reel V4 [skip ci]"
          git push origin HEAD:reel-render-v4

      - name: Upload reel artifact
        uses: actions/upload-artifact@v4
        with:
          name: sellf-hero-reel-v4-offline
          path: ${{ env.OUT }}
          if-no-files-found: error
