name: Bootstrap Sellf V2 source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify V2 source archive
        run: |
          test "$(find .bootstrap/parts -maxdepth 1 -type f -name 'part-*' | wc -l)" -eq 24
          cat .bootstrap/parts/part-* > /tmp/source.b64
          base64 --decode /tmp/source.b64 > /tmp/source.tgz
          gzip -t /tmp/source.tgz

      - name: Unpack exact V2 source
        run: |
          tar -xzf /tmp/source.tgz -C .
          rm -rf .bootstrap

      - name: Commit source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Sellf V2 source"
          git push origin HEAD:main
