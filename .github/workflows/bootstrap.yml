name: Bootstrap Sellf V2 source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/source.tgz'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack V2 source
        run: |
          tar -xzf .bootstrap/source.tgz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
      - name: Commit source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Sellf V2 source" || exit 0
          git push origin HEAD:main
