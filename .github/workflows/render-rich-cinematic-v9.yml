name: Render Sellf Reel V9 Rich Cinematic Master

on:
  push:
    branches: [reel-render-v9]
    paths:
      - '.github/workflows/render-rich-cinematic-v9.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reel-render-v9

      - name: Prepare tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet gdown
          mkdir -p src polish clips work output

      - name: Download locked sources and V7.3 audio master
        shell: bash
        run: |
          set -euo pipefail
          dl() { gdown "https://drive.google.com/uc?id=$1" -O "$2"; }
          dl 1f9kaSmFRlm4iZXNDHKE5uKf94wto28K6 src/umu.mp4
          dl 1wIbo1BkMATXxqSJExaVRhHCrVlCdcxFf src/moshiqa.mp4
          dl 1B8h8sCxJMFJF0w3m95aat5ivxhhgYy9o src/stilevs.mp4
          dl 1MzQj0GgIN7RBeWv-ZWN8n7goPXIaxxbX src/barilla.mp4
          dl 1KuaY5fyCZNyPgy4HQwT1wwNtVVhm4kOY src/fashion.mp4
          dl 1X2sUkRWkQQi4yv_3kAOPb_EePDt2pcIN src/mion.mp4
          dl 17ByjQGmWnAD1rjqLHLdX7rJWskywQcZH src/eataly.mp4
          dl 13KwB8IEn1Rf0LVYG2NkWe05PphYLwt1a src/tefal.mp4
          dl 1MxYmNIvvHM2VPmPv02cFul7zc3GY2whL src/unilever.mp4
          curl -L --fail --retry 3 -o src/hero-original.mp4 https://cdn.sellfmedia.workers.dev/videos/website_main_video.mp4
          curl -L --fail --retry 3 -o src/logo.png https://raw.githubusercontent.com/sellfmedia-del/sellfV2/main/public/logo-beyaz.png
          curl -L --fail --retry 3 -o work/v7_3.mp4 https://github.com/sellfmedia-del/sellfV2/releases/download/reel-v7-3-clean/sellf_hero_reel_v7_3_final_watermark_free.mp4

      - name: Download five approved Runway polish shots
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o polish/umu.mp4 'https://dnznrvs05pmza.cloudfront.net/d3df0277-5279-44e9-a25b-a0913b36a4bf.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYmE0OWVlZTQ0YzQ0NDkxMiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTA1ODY2MH0.f9r4UXYGntLGgynIXdNfwAjXBTA1IhYuOEEzxS-D4jU'
          curl -L --fail --retry 3 -o polish/barilla.mp4 'https://dnznrvs05pmza.cloudfront.net/01a23d4d-e5ab-47ca-8e27-fcae6964b6d2.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZWUyOGVlZjA3MTEyZmQxNiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTAwNDAxNn0.YBk96JqYv-2WW1u8PrCVpR6LOePLqKFwOKNmjDNnIo0'
          curl -L --fail --retry 3 -o polish/fashion.mp4 'https://dnznrvs05pmza.cloudfront.net/ad695da1-fa22-4129-846e-689d7da4d023.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZDRkYjU4NzNjMmYyYmEzNSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTA1ODQxOX0.co_zbEM95h07MdXXdNOl2E6cnPuFHkw_av5JDrNGnU4'
          curl -L --fail --retry 3 -o polish/eataly.mp4 'https://dnznrvs05pmza.cloudfront.net/65b38b55-255d-4b1c-9042-9c2aae2062e0.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZDc3ZTFlNDIwMDMyZmE3ZSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTA0MzUyMn0.r1Bq5-a8a87NurDlBx1xVfyt0KNHoYnI8pikhLjS7Mk'
          curl -L --fail --retry 3 -o polish/moshiqa.mp4 'https://dnznrvs05pmza.cloudfront.net/7e568417-1811-4461-a9eb-22a1084a71a4.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMzcyOTMzOGRkN2MyY2NlOCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTAxNTA1M30.bCq2wr1TRdVV6Crm1skJzUma78P0JbLswk-NjkwW2e0'
          for f in polish/*.mp4; do ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$f"; done

      - name: Rebuild V7.3 picture lock with selective polished cuts
        shell: bash
        run: |
          set -euo pipefail

          base_grade="eq=contrast=1.115:saturation=0.885:brightness=-0.018:gamma=0.978,colorbalance=rs=.018:gs=.006:bs=-.012:rh=.028:gh=.012:bh=-.020,vignette=PI/13,unsharp=5:5:0.18:5:5:0.0,noise=alls=1.05:allf=t"
          density_finish="curves=all='0/0 0.12/0.095 0.48/0.485 0.82/0.842 1/0.985',eq=contrast=1.015:saturation=0.985:gamma=0.997,colorbalance=rs=.006:gs=.002:bs=-.004:rh=.010:gh=.003:bh=-.006,unsharp=5:5:0.045:5:5:0.0,noise=alls=0.18:allf=t"

          make_timed() {
            local input="$1" output="$2" start="$3" rawlen="$4" outlen="$5" mode="$6" speed="$7"
            local pre vf
            case "$mode" in
              cropbottom) pre="crop=iw:ih*0.78:0:0," ;;
              event) pre="crop=iw:ih*0.86:0:ih*0.02," ;;
              *) pre="" ;;
            esac
            vf="${pre}scale=1980:1114:force_original_aspect_ratio=increase,crop=1920:1080:(iw-ow)/2:(ih-oh)/2,fps=30,setsar=1,${base_grade},${density_finish},setpts=PTS/${speed},trim=duration=${outlen},setpts=PTS-STARTPTS"
            ffmpeg -hide_banner -loglevel error -ss "$start" -i "$input" -t "$rawlen" -vf "$vf" -an -c:v libx264 -preset fast -crf 15 -pix_fmt yuv420p -movflags +faststart "$output" -y
          }

          make_fraction() {
            local input="$1" output="$2" fraction="$3" rawlen="$4" outlen="$5" mode="$6" speed="$7"
            local dur start
            dur=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$input")
            start=$(python -c 'import sys; D=float(sys.argv[1]); f=float(sys.argv[2]); L=float(sys.argv[3]); print(f"{max(.2,min(D*f,D-L-.3)):.3f}")' "$dur" "$fraction" "$rawlen")
            make_timed "$input" "$output" "$start" "$rawlen" "$outlen" "$mode" "$speed"
          }

          make_polished() {
            local input="$1" output="$2" offset="$3" outlen="$4" speed="$5"
            ffmpeg -hide_banner -loglevel error -ss "$offset" -i "$input" \
              -vf "fps=30,setsar=1,${density_finish},setpts=PTS/${speed},trim=duration=${outlen},setpts=PTS-STARTPTS" \
              -an -c:v libx264 -preset fast -crf 14 -pix_fmt yuv420p -movflags +faststart "$output" -y
          }

          # Derive the exact source-in offsets inside the 4-second Runway source windows.
          umu_dur=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 src/umu.mp4)
          umu_start=$(python -c 'import sys; D=float(sys.argv[1]); print(max(.2,min(D*.12,D-1.15-.3)))' "$umu_dur")
          umu_off=$(python -c 'import sys; print(f"{max(0,float(sys.argv[1])-6.8):.3f}")' "$umu_start")

          bar_dur=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 src/barilla.mp4)
          bar_orig=$(python -c 'import sys; D=float(sys.argv[1]); print(max(.2,min(D*.23,D-1.10-.3)))' "$bar_dur")
          bar_win=$(python -c 'import sys; D=float(sys.argv[1]); print(max(.2,min(D*.23,D-4.3)))' "$bar_dur")
          bar_off=$(python -c 'import sys; print(f"{max(0,float(sys.argv[1])-float(sys.argv[2])):.3f}")' "$bar_orig" "$bar_win")

          eat_dur=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 src/eataly.mp4)
          eat_orig=$(python -c 'import sys; D=float(sys.argv[1]); print(max(.2,min(D*.18,D-1.25-.3)))' "$eat_dur")
          eat_win=$(python -c 'import sys; D=float(sys.argv[1]); print(max(.2,min(D*.18,D-4.3)))' "$eat_dur")
          eat_off=$(python -c 'import sys; print(f"{max(0,float(sys.argv[1])-float(sys.argv[2])):.3f}")' "$eat_orig" "$eat_win")

          echo "Polish offsets: UMU=$umu_off Barilla=$bar_off Fashion=.850 Eataly=$eat_off Moshiqa=1.100"

          # Exact V7.3 cut durations/order. Only five source shots are swapped for their approved polished counterparts.
          make_polished polish/umu.mp4     clips/01.mp4 "$umu_off" 0.82 1.15
          make_timed    src/moshiqa.mp4    clips/02.mp4 7.75 0.95 0.64 normal 1.18
          make_timed    src/stilevs.mp4    clips/03.mp4 18.45 1.20 0.90 normal 1.10
          make_polished polish/barilla.mp4 clips/04.mp4 "$bar_off" 0.76 1.16
          make_polished polish/fashion.mp4 clips/05.mp4 0.850 0.67 1.18
          make_fraction src/mion.mp4       clips/06.mp4 0.24 1.10 0.84 normal 1.12
          make_polished polish/eataly.mp4  clips/07.mp4 "$eat_off" 0.96 1.08
          make_fraction src/umu.mp4        clips/08.mp4 0.68 1.05 0.70 normal 1.18

          # Typography is rebuilt exactly from the locked recipe and receives NO new density finish.
          ffmpeg -hide_banner -loglevel error -ss 6 -i src/hero-original.mp4 -t 8 \
            -filter_complex "[0:v]scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,fps=30,setsar=1,split=2[base][sample];[sample]crop=250:86:40:984[patch];[base][patch]overlay=1660:984:format=auto,eq=contrast=1.025:saturation=0.975:brightness=-0.004[out]" \
            -map "[out]" -an -c:v libx264 -preset fast -crf 14 -pix_fmt yuv420p clips/09_typography.mp4 -y

          make_polished polish/moshiqa.mp4 clips/10.mp4 1.100 0.74 1.16
          make_timed    src/stilevs.mp4    clips/11.mp4 41.90 0.95 0.62 normal 1.20
          make_fraction src/tefal.mp4      clips/12.mp4 0.63 1.10 0.78 cropbottom 1.14
          make_timed    src/moshiqa.mp4    clips/13.mp4 46.70 0.90 0.58 normal 1.20
          make_timed    src/stilevs.mp4    clips/14.mp4 63.80 1.15 0.88 normal 1.10
          make_fraction src/barilla.mp4    clips/15.mp4 0.67 1.00 0.66 normal 1.18
          make_fraction src/unilever.mp4   clips/16.mp4 0.62 1.08 0.74 normal 1.16
          make_timed    src/fashion.mp4    clips/17.mp4 46.40 1.20 0.84 event 1.12
          make_fraction src/eataly.mp4     clips/18.mp4 0.72 1.05 0.70 cropbottom 1.18
          make_fraction src/mion.mp4       clips/19.mp4 0.73 1.10 0.76 normal 1.16
          make_timed    src/stilevs.mp4    clips/20.mp4 75.30 0.95 0.62 normal 1.20
          make_timed    src/fashion.mp4    clips/21.mp4 30.70 1.15 0.84 event 1.12
          make_timed    src/moshiqa.mp4    clips/22.mp4 52.80 1.00 0.68 normal 1.18

          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=white:s=1920x1080:r=30:d=0.034 -an -c:v libx264 -crf 10 -pix_fmt yuv420p clips/flash.mp4 -y
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=black:s=1920x1080:r=30:d=0.067 -an -c:v libx264 -crf 10 -pix_fmt yuv420p clips/black2.mp4 -y

          # Sellf outro is copied from the exact locked recipe and receives NO new density finish.
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=black:s=1920x1080:r=30:d=2.65 -loop 1 -i src/logo.png \
            -filter_complex "[1:v]scale=340:-1[lg];[0:v][lg]overlay=(W-w)/2:225:shortest=1,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='sellfmedia.com':fontcolor=white:fontsize=29:x=(w-text_w)/2:y=805,fade=t=in:st=0:d=0.24,fade=t=out:st=2.20:d=0.45,fps=30,setsar=1" \
            -t 2.65 -an -c:v libx264 -preset fast -crf 15 -pix_fmt yuv420p clips/23_outro.mp4 -y

          printf "%s\n" \
            "file '01.mp4'" "file '02.mp4'" "file '03.mp4'" "file 'flash.mp4'" \
            "file '04.mp4'" "file '05.mp4'" "file '06.mp4'" "file '07.mp4'" "file '08.mp4'" \
            "file 'black2.mp4'" "file '09_typography.mp4'" "file 'black2.mp4'" \
            "file '10.mp4'" "file '11.mp4'" "file '12.mp4'" "file '13.mp4'" "file 'flash.mp4'" \
            "file '14.mp4'" "file '15.mp4'" "file '16.mp4'" "file '17.mp4'" "file '18.mp4'" \
            "file '19.mp4'" "file '20.mp4'" "file '21.mp4'" "file '22.mp4'" "file 'black2.mp4'" "file '23_outro.mp4'" > clips/list.txt

          # Preserve the approved V7.1 optical micro-motion/base texture exactly.
          ffmpeg -hide_banner -loglevel error -f concat -safe 0 -i clips/list.txt -an \
            -vf "crop=1916:1078:x='2+0.6*sin(n*0.41)':y='1+0.45*sin(n*0.33)',scale=1920:1080,eq=contrast=1.018:saturation=0.98:gamma=0.994,noise=alls=0.35:allf=t" \
            -c:v libx264 -preset medium -crf 15 -pix_fmt yuv420p -movflags +faststart work/v9_v71_picture.mp4 -y

          # Reproduce the approved V7.2 typography punch-in at its exact locked timeline interval.
          ffmpeg -hide_banner -loglevel error -i work/v9_v71_picture.mp4 -t 6.391 \
            -vf "fps=30,setsar=1" -an -c:v libx264 -preset medium -crf 15 -pix_fmt yuv420p work/pre.mp4 -y
          ffmpeg -hide_banner -loglevel error -ss 6.391 -i work/v9_v71_picture.mp4 -t 8.000 \
            -vf "crop=1600:900:160:0,scale=1920:1080:flags=lanczos,fps=30,setsar=1" \
            -an -c:v libx264 -preset medium -crf 14 -pix_fmt yuv420p work/typography_clean.mp4 -y
          ffmpeg -hide_banner -loglevel error -ss 14.391 -i work/v9_v71_picture.mp4 \
            -vf "fps=30,setsar=1" -an -c:v libx264 -preset medium -crf 15 -pix_fmt yuv420p work/post.mp4 -y
          printf "%s\n" "file 'pre.mp4'" "file 'typography_clean.mp4'" "file 'post.mp4'" > work/v72_list.txt
          ffmpeg -hide_banner -loglevel error -f concat -safe 0 -i work/v72_list.txt -an \
            -c:v libx264 -preset medium -crf 15 -pix_fmt yuv420p -movflags +faststart work/v9_v72_picture.mp4 -y

          # Reproduce the V7.3 final watermark cleanup only; no other typography change.
          ffmpeg -hide_banner -loglevel error -i work/v9_v72_picture.mp4 \
            -vf "drawbox=x=1300:y=885:w=620:h=195:color=black@1:t=fill:enable='between(t,13.20,15.75)',fps=30,setsar=1" \
            -an -c:v libx264 -preset medium -crf 14 -pix_fmt yuv420p -movflags +faststart work/v9_picture.mp4 -y

          # Preserve the current V7.3 audio stream exactly — no remaster, music change, or re-encode.
          ffmpeg -hide_banner -loglevel error -i work/v9_picture.mp4 -i work/v7_3.mp4 \
            -map 0:v:0 -map 1:a:0? -c:v copy -c:a copy -shortest -movflags +faststart \
            output/sellf_hero_reel_v9_rich_cinematic_master.mp4 -y

          ffprobe -v error -show_entries format=duration,size -of default=nw=1 output/sellf_hero_reel_v9_rich_cinematic_master.mp4

          for t in 1 3 5 7 11 14 16 19 22 25; do
            ffmpeg -hide_banner -loglevel error -ss "$t" -i output/sellf_hero_reel_v9_rich_cinematic_master.mp4 -frames:v 1 -q:v 2 "output/qc_${t}s.jpg" -y
          done
          ffmpeg -hide_banner -loglevel error -pattern_type glob -i 'output/qc_*s.jpg' -vf 'scale=480:-1,tile=5x2' -frames:v 1 output/v9_qc_contact.jpg -y

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: sellf-hero-reel-v9-rich-cinematic-master
          path: output/*
          if-no-files-found: error

      - name: Publish review release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete reel-v9-rich-cinematic --yes --cleanup-tag 2>/dev/null || true
          gh release create reel-v9-rich-cinematic \
            "output/sellf_hero_reel_v9_rich_cinematic_master.mp4#Sellf Hero Reel V9 — Rich Cinematic Master" \
            "output/v9_qc_contact.jpg#V9 QC contact sheet" \
            --target "$GITHUB_SHA" \
            --title "Sellf Hero Reel V9 Rich Cinematic Master" \
            --notes "V7.3 picture-lock preserved. Five approved real-footage shots (UMU fashion, Barilla lifestyle, fashion event, Eataly macro, Moshiqa detail) are replaced from their Runway-polished source windows using the original source-in/speed/crop/cut recipe. All remaining shots keep the locked V7.3 edit. New film-density finish is applied only to real footage. Typography and Sellf outro keep the approved locked recipe. Audio is copied bit-for-bit from V7.3. No additional AI generation used. Review master only; main/live hero is unchanged."
