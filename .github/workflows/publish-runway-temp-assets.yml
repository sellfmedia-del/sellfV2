name: Publish Runway Temp Assets

on:
  push:
    branches: [reel-render-v7-1]
    paths:
      - '.github/workflows/publish-runway-temp-assets.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reel-render-v7-1
          fetch-depth: 0
      - name: Download approved candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p tmp public/runway-temp
          gh run download 34270194368 --name sellf-hero-reel-v7-1-clean-typography --dir tmp
          cp tmp/runway/01_fashion_umu.mp4 public/runway-temp/
          cp tmp/runway/02_product_stilevs.mp4 public/runway-temp/
          cp tmp/runway/04_moshiqa_detail.mp4 public/runway-temp/
          cp tmp/runway/05_eataly_macro.mp4 public/runway-temp/
          cp tmp/runway/06_barilla_lifestyle.mp4 public/runway-temp/
      - name: Commit temporary assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/runway-temp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add temporary Runway polish source clips'
          git push origin HEAD:reel-render-v7-1
