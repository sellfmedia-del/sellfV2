name: Apply V2 Polish Pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-polish.yml'
      - '.polish/polish.tgz'

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply polished source files
        run: |
          tar -xzf .polish/polish.tgz
          rm -f .polish/polish.tgz
          rm -f .github/workflows/apply-polish.yml

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production build
        run: npm run build

      - name: Commit polished V2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish V2 visual system"
          git push origin HEAD:main
