name: Apply V2 Polish Pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-polish.yml'
      - '.polish/**'

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify polish package
        shell: bash
        run: |
          set -euo pipefail
          cat .polish/chunk_00 .polish/chunk_01 .polish/chunk_02 .polish/chunk_03 .polish/chunk_04 .polish/chunk_05 .polish/chunk_06 > /tmp/polish.b64
          base64 -d /tmp/polish.b64 > /tmp/polish.tgz
          echo "6d5b558883a5ce7818585be9d94193d769bd2145be2ef49248f74b719c308230  /tmp/polish.tgz" | sha256sum -c -
          gzip -t /tmp/polish.tgz

      - name: Apply polished source files
        run: |
          set -euo pipefail
          tar -xzf /tmp/polish.tgz

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production build
        run: npm run build

      - name: Commit polished V2
        run: |
          set -euo pipefail
          rm -rf .polish
          rm -f .github/workflows/apply-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish V2 visual system"
          git push origin HEAD:main
