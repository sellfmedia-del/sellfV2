name: Render Sellf Reel V6.1 Clean Cinematic

on:
  push:
    branches: [reel-render-v6-1]
    paths:
      - '.github/workflows/render-offline-reel-v6-1.yml'

permissions:
  contents: write

env:
  OUT: reel-output/sellf_hero_reel_v6_1_cinematic_clean.mp4

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reel-render-v6-1

      - name: Prepare tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet gdown
          mkdir -p src clips reel-output

      - name: Download approved source footage
        shell: bash
        run: |
          set -euo pipefail
          dl() { gdown "https://drive.google.com/uc?id=$1" -O "$2"; }
          dl 1f9kaSmFRlm4iZXNDHKE5uKf94wto28K6 src/umu.mp4
          dl 1wIbo1BkMATXxqSJExaVRhHCrVlCdcxFf src/moshiqa.mp4
          dl 1B8h8sCxJMFJF0w3m95aat5ivxhhgYy9o src/stilevs.mp4
          dl 1MzQj0GgIN7RBeWv-ZWN8n7goPXIaxxbX src/barilla.mp4
          dl 1KuaY5fyCZNyPgy4HQwT1wwNtVVhm4kOY src/fashion.mp4
          dl 1X2sUkRWkQQi4yv_3kAOPb_EePDt2pcIN src/mion.mp4
          dl 17ByjQGmWnAD1rjqLHLdX7rJWskywQcZH src/eataly.mp4
          dl 13KwB8IEn1Rf0LVYG2NkWe05PphYLwt1a src/tefal.mp4
          dl 1MxYmNIvvHM2VPmPv02cFul7zc3GY2whL src/unilever.mp4
          curl -L --fail --retry 3 -o src/hero-original.mp4 https://cdn.sellfmedia.workers.dev/videos/website_main_video.mp4
          curl -L --fail --retry 3 -o src/logo.png https://raw.githubusercontent.com/sellfmedia-del/sellfV2/main/public/logo-beyaz.png

      - name: Build clean cinematic picture lock
        shell: bash
        run: |
          set -euo pipefail

          base_grade="eq=contrast=1.095:saturation=0.90:brightness=-0.014:gamma=0.982,vignette=PI/12,unsharp=5:5:0.22:5:5:0.0,noise=alls=1.15:allf=t"

          make_timed() {
            local input="$1" output="$2" start="$3" len="$4" mode="$5"
            local pre vf
            case "$mode" in
              cropbottom) pre="crop=iw:ih*0.78:0:0," ;;
              event) pre="crop=iw:ih*0.86:0:ih*0.02," ;;
              *) pre="" ;;
            esac
            vf="${pre}scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,fps=30,setsar=1,${base_grade}"
            ffmpeg -hide_banner -loglevel error -ss "$start" -i "$input" -t "$len" -vf "$vf" -an -c:v libx264 -preset fast -crf 17 -pix_fmt yuv420p -movflags +faststart "$output" -y
          }

          make_fraction() {
            local input="$1" output="$2" fraction="$3" len="$4" mode="$5"
            local dur start
            dur=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$input")
            start=$(python -c 'import sys; D=float(sys.argv[1]); f=float(sys.argv[2]); L=float(sys.argv[3]); print(f"{max(.2,min(D*f,D-L-.3)):.3f}")' "$dur" "$fraction" "$len")
            make_timed "$input" "$output" "$start" "$len" "$mode"
          }

          # Approved aesthetic-first shot selection from V6.
          make_fraction src/umu.mp4       clips/01.mp4 0.12 1.05 normal
          make_timed    src/moshiqa.mp4   clips/02.mp4 7.75 1.00 normal
          make_timed    src/stilevs.mp4   clips/03.mp4 18.45 1.05 normal
          make_fraction src/barilla.mp4   clips/04.mp4 0.23 1.10 normal
          make_timed    src/fashion.mp4   clips/05.mp4 37.75 1.05 event
          make_fraction src/mion.mp4      clips/06.mp4 0.24 1.00 normal
          make_fraction src/eataly.mp4    clips/07.mp4 0.18 1.10 cropbottom
          make_fraction src/umu.mp4       clips/08.mp4 0.68 1.05 normal

          # Clean kinetic typography: remove the bottom-right Clideo watermark without recreating the typography.
          # Delogo interpolation is confined to the watermark area; a tiny safety crop removes any residual edge pixels.
          ffmpeg -hide_banner -loglevel error -ss 6 -i src/hero-original.mp4 -t 8 \
            -vf "scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,delogo=x=1682:y=996:w=228:h=72:show=0,crop=1888:1048:16:8,scale=1920:1080,fps=30,setsar=1,eq=contrast=1.02:saturation=0.98:brightness=-0.003,fade=t=in:st=0:d=0.07,fade=t=out:st=7.93:d=0.07" \
            -an -c:v libx264 -preset fast -crf 16 -pix_fmt yuv420p clips/09_typography.mp4 -y

          make_timed    src/moshiqa.mp4   clips/10.mp4 22.80 1.05 normal
          make_timed    src/stilevs.mp4   clips/11.mp4 41.90 1.00 normal
          make_fraction src/tefal.mp4     clips/12.mp4 0.63 1.05 cropbottom
          make_timed    src/moshiqa.mp4   clips/13.mp4 46.70 0.95 normal
          make_timed    src/stilevs.mp4   clips/14.mp4 63.80 1.00 normal
          make_fraction src/barilla.mp4   clips/15.mp4 0.67 1.05 normal
          make_fraction src/unilever.mp4  clips/16.mp4 0.62 1.05 normal
          make_timed    src/fashion.mp4   clips/17.mp4 46.40 1.10 event
          make_fraction src/eataly.mp4    clips/18.mp4 0.72 1.05 cropbottom
          make_fraction src/mion.mp4      clips/19.mp4 0.73 1.00 normal
          make_timed    src/stilevs.mp4   clips/20.mp4 75.30 1.00 normal
          make_timed    src/fashion.mp4   clips/21.mp4 30.70 1.10 event
          make_timed    src/moshiqa.mp4   clips/22.mp4 52.80 1.05 normal

          # Final card: only real Sellf mark + domain with generous separation.
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=black:s=1920x1080:r=30:d=3.0 -loop 1 -i src/logo.png \
            -filter_complex "[1:v]scale=340:-1[lg];[0:v][lg]overlay=(W-w)/2:225:shortest=1,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='sellfmedia.com':fontcolor=white:fontsize=29:x=(w-text_w)/2:y=805,fade=t=in:st=0:d=0.28,fade=t=out:st=2.55:d=0.45,fps=30,setsar=1" \
            -t 3 -an -c:v libx264 -preset fast -crf 16 -pix_fmt yuv420p clips/23_outro.mp4 -y

          printf "%s\n" \
            "file '01.mp4'" "file '02.mp4'" "file '03.mp4'" "file '04.mp4'" \
            "file '05.mp4'" "file '06.mp4'" "file '07.mp4'" "file '08.mp4'" \
            "file '09_typography.mp4'" \
            "file '10.mp4'" "file '11.mp4'" "file '12.mp4'" "file '13.mp4'" \
            "file '14.mp4'" "file '15.mp4'" "file '16.mp4'" "file '17.mp4'" \
            "file '18.mp4'" "file '19.mp4'" "file '20.mp4'" "file '21.mp4'" \
            "file '22.mp4'" "file '23_outro.mp4'" > clips/list.txt

          ffmpeg -hide_banner -loglevel error -f concat -safe 0 -i clips/list.txt -an \
            -vf "eq=contrast=1.015:saturation=0.985:gamma=0.995,noise=alls=0.45:allf=t" \
            -c:v libx264 -preset medium -crf 17 -pix_fmt yuv420p -movflags +faststart reel-output/v6_1_picture.mp4 -y

          # Keep the previously approved original hero audio bed.
          ffmpeg -hide_banner -loglevel error -i reel-output/v6_1_picture.mp4 -i src/hero-original.mp4 \
            -filter_complex "[1:a]asetpts=N/SR/TB,acompressor=threshold=-18dB:ratio=2.2:attack=15:release=180,loudnorm=I=-15:TP=-1.5:LRA=8,afade=t=in:st=0:d=0.20[a]" \
            -map 0:v:0 -map "[a]" -c:v copy -c:a aac -b:a 192k -shortest -movflags +faststart "$OUT" -y

          ffprobe -v error -show_entries format=duration,size -of default=nw=1 "$OUT"

          # Create a review contact sheet around the typography and overall cut for QC.
          ffmpeg -hide_banner -loglevel error -i "$OUT" -vf "fps=1/3,scale=480:-1,tile=4x3" -frames:v 1 reel-output/v6_1_qc.jpg -y

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: sellf-hero-reel-v6-1-cinematic-clean
          path: |
            ${{ env.OUT }}
            reel-output/v6_1_qc.jpg
          if-no-files-found: error

      - name: Publish review release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete reel-v6-1-cinematic --yes --cleanup-tag 2>/dev/null || true
          gh release create reel-v6-1-cinematic "$OUT#Sellf Hero Reel V6.1 — clean cinematic master" reel-output/v6_1_qc.jpg#QC-contact-sheet --target "$GITHUB_SHA" --title "Sellf Hero Reel V6.1 Cinematic" --notes "Approved V6 shot selection preserved. Clideo watermark removed from the typography sequence. Subtle cinematic grading, grain, contrast and audio polish added. This is the clean pre-Runway picture-lock master."
