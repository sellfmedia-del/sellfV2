name: Render Sellf Reel V8 Final Cinematic Master

on:
  push:
    branches: [reel-render-v7-1]
    paths:
      - '.github/workflows/render-final-reel-v8.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reel-render-v7-1

      - name: Prepare tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p work output

      - name: Download locked V7.3 master
        run: |
          curl -L --fail --retry 3 -o work/v7_3.mp4 \
            https://github.com/sellfmedia-del/sellfV2/releases/download/reel-v7-3-clean/sellf_hero_reel_v7_3_final_watermark_free.mp4

      - name: Apply final cinematic mastering pass
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -i work/v7_3.mp4 \
            -filter_complex "[0:v]split=2[base][hi];[hi]lutyuv=y='if(gte(val,190),min(255,(val-190)*3.0),0)':u=128:v=128,gblur=sigma=6:steps=1,colorbalance=rs=.040:gs=.014:bs=-.012[bloom];[base][bloom]blend=all_mode=screen:all_opacity=0.075,curves=all='0/0 0.16/0.135 0.48/0.50 0.80/0.86 1/1',eq=contrast=1.022:saturation=0.965:gamma=0.995,colorbalance=rs=.009:gs=.002:bs=-.007:rh=.017:gh=.006:bh=-.009,vignette=PI/24,noise=alls=0.28:allf=t,unsharp=5:5:0.06:5:5:0.0,fps=30,setsar=1[v];[0:a]highpass=f=32,acompressor=threshold=-17dB:ratio=1.75:attack=18:release=180,loudnorm=I=-14.5:TP=-1.2:LRA=6[a]" \
            -map "[v]" -map "[a]" \
            -c:v libx264 -preset fast -crf 15 -pix_fmt yuv420p -profile:v high -level 4.1 \
            -c:a aac -b:a 224k -movflags +faststart \
            output/sellf_hero_reel_v8_final_cinematic_master.mp4 -y

          ffprobe -v error -show_entries format=duration,size -of default=nw=1 output/sellf_hero_reel_v8_final_cinematic_master.mp4

          for t in 2 5 8 11 14 17 20 23 26; do
            ffmpeg -hide_banner -loglevel error -ss "$t" -i output/sellf_hero_reel_v8_final_cinematic_master.mp4 -frames:v 1 -q:v 2 "output/qc_${t}s.jpg" -y
          done
          ffmpeg -hide_banner -loglevel error -pattern_type glob -i 'output/qc_*s.jpg' -vf 'scale=480:-1,tile=3x3' -frames:v 1 output/v8_qc_contact.jpg -y

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sellf-hero-reel-v8-final-cinematic-master
          path: output/*
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete reel-v8-final --yes --cleanup-tag 2>/dev/null || true
          gh release create reel-v8-final \
            "output/sellf_hero_reel_v8_final_cinematic_master.mp4#Sellf Hero Reel V8 — final cinematic master" \
            "output/v8_qc_contact.jpg#V8 QC contact sheet" \
            --target "$GITHUB_SHA" \
            --title "Sellf Hero Reel V8 Final Cinematic Master" \
            --notes "Picture-locked V7.3 with final cinematic mastering: controlled highlight bloom, denser filmic contrast, restrained warmth, subtle texture, vignette, sharpening and audio mastering. Typography and outro remain unchanged."
